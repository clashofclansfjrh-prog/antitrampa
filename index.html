<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Docente - Generador de Exámenes Anti-Trampas</title>

  <!-- SIEMPRE USAR FORMATO LATEX COMPLETO EN LIBRERÍAS MATEMÁTICAS COMO KATEK O MATHJAX SI FUERA NECESARIO -->
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f5; margin: 0; padding: 20px; color: #17365d; }
    .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    h1 { margin-top: 0; color: #17365d; }
    label { display: block; margin: 15px 0 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { background: #2f75b5; color: white; border: 0; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; width: 100%; font-size: 16px; }
    button:hover { background: #17365d; }
    .result-box { margin-top: 25px; padding: 15px; background: #e8f1f7; border: 1px dashed #2f75b5; border-radius: 8px; display: none; }
    .result-box input { background: #fff; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>⚙️ Panel del Profesor</h1>
  <p>Crea un examen protegido en segundos a partir de un PDF.</p>

  <label for="pdfUrl">1. URL pública del PDF de la evaluación:</label>
  <input type="text" id="pdfUrl" placeholder="https://ejemplo.com/mi_evaluacion.pdf o link de Google Drive">

  <label for="examTitle">2. Título de la Evaluación:</label>
  <input type="text" id="examTitle" placeholder="Ej: Prueba Parcial de Historia - 8vo Básico">

  <label for="questionsCount">3. Cantidad de preguntas de Selección Múltiple:</label>
  <input type="number" id="questionsCount" min="1" max="50" value="5">

  <label for="scriptUrl">4. URL de tu Web App de Google Apps Script (para recibir datos):</label>
  <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec">

  <button type="button" onclick="generateExamLink()">🚀 Generar Link del Examen para Alumnos</button>

  <div id="resultBox" class="result-box">
    <h3>✅ ¡Examen Generado!</h3>
    <p>Comparte este enlace con tus estudiantes:</p>
    <input type="text" id="generatedLink" readonly>
    <button type="button" onclick="copyLink()" style="background:#21897e; margin-top:10px;">📋 Copiar Enlace</button>
  </div>
</div>

<script>
  function generateExamLink() {
    const pdf = encodeURIComponent(document.getElementById("pdfUrl").value.trim());
    const title = encodeURIComponent(document.getElementById("examTitle").value.trim());
    const count = document.getElementById("questionsCount").value;
    const script = encodeURIComponent(document.getElementById("scriptUrl").value.trim());

    if (!pdf || !title || !script) {
      alert("Por favor completa todos los campos.");
      return;
    }

    // La URL base asumirá que el alumno abre 'alumno.html' en tu GitHub Pages
    const baseUrl = window.location.href.replace("profesor.html", "alumno.html");
    const finalUrl = `${baseUrl}?pdf=${pdf}&title=${title}&q=${count}&script=${script}`;

    document.getElementById("generatedLink").value = finalUrl;
    document.getElementById("resultBox").style.display = "block";
  }

  function copyLink() {
    const linkInput = document.getElementById("generatedLink");
    linkInput.select();
    document.execCommand("copy");
    alert("¡Enlace copiado al portapapeles!");
  }
</script>

</body>
</html>
